name: C/C++ CI

on:
  push:
    branches: [ "main", "development", "experimental", "test*" ]
  pull_request:
    branches: [ "main", "development", "experimental", "test*" ]

jobs:
  build:

    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:        
        runs-on: [ubuntu-latest, ubuntu-22.04, macos-latest, macos-14 ]
        python-version: [ "3.12" ]

    steps:
    - uses: actions/checkout@v4

    - name: C++ info
      run: g++ -v

    - name: Install dependencies (Ubuntu)
      if: ${{ contains(matrix.runs-on, 'ubuntu') }}
      run: |
          sudo apt-get install -y nlohmann-json3-dev libopenlibm-dev
      
    - name: Install dependencies (macOS)
      if: ${{ contains(matrix.runs-on, 'macos') }}
      run: |
        brew install nlohmann-json openlibm

    - name: make and run
      run: |
        make
        time  ./main 1233

        git diff fitness.dat  best.gen.dat phenotype.dat 
      
    - name: list generated files
      run: |
          ls -alth
